services:
  app:
    build:
      context: .
      target: dev
    ports:
      - '5173:5173'
    environment:
      - VITE_PAYLOAD_URL=${VITE_PAYLOAD_URL:-}
      - PAYLOAD_ORIGIN=${PAYLOAD_ORIGIN}
      - PAYLOAD_PATH=${PAYLOAD_PATH}
    volumes:
      - .:/app
      # Anonymous volume, so the host's node_modules are not mounted over.
      - /app/node_modules
    networks:
      - flow-net

  app-prod:
    profiles: ['prod']
    build:
      context: .
      target: prod
      args:
        VITE_PAYLOAD_URL: ${VITE_PAYLOAD_URL:-}
    ports:
      - '8080:80'
    environment:
      - PAYLOAD_ORIGIN=${PAYLOAD_ORIGIN}
      - PAYLOAD_PATH=${PAYLOAD_PATH}
      - PAYLOAD_HOST=${PAYLOAD_HOST}
    networks:
      - flow-net

networks:
  flow-net:
    driver: bridge
