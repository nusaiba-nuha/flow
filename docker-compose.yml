services:
  app:
    build:
      context: .
      target: dev
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      # Anonymous volume, so the host's node_modules are not mounted over.
      - /app/node_modules

  app-prod:
    profiles: ['prod']
    build:
      context: .
      target: prod
    ports:
      - '8080:80'
