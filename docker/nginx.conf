server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Deep links such as /flow/node/b6a0c1 are client-side routes. Without this,
  # nginx looks for a file at that path and returns 404 on a refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets can be cached hard; index.html must not be, or a deploy is
  # invisible until the browser gives up its copy.
  location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
