name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fails if package.json and the lockfile have drifted.
      - run: npm ci

      # Each step runs even if an earlier one failed, so one run reports everything.
      - name: Lint
        if: '!cancelled()'
        run: npx eslint .

      - name: Type check
        if: '!cancelled()'
        run: npm run typecheck

      - name: Unit tests
        if: '!cancelled()'
        run: npm run test:coverage

      - name: Build
        if: '!cancelled()'
        run: npm run build
