name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fails if package.json and the lockfile have drifted.
      - run: npm ci

      # Each step runs even if an earlier one failed, so one run reports everything.
      - name: Lint
        if: '!cancelled()'
        run: npx eslint .

      - name: Type check
        if: '!cancelled()'
        run: npm run typecheck

      - name: Unit tests
        if: '!cancelled()'
        run: npm run test:coverage

      - name: Build
        if: '!cancelled()'
        run: npm run build

      # The examples are Flow's own diagrams: they must parse, and the SVGs next
      # to them must be what the renderer draws today.
      - name: Examples
        if: '!cancelled()'
        run: |
          npm run -s flow -- check examples/*.flow
          for file in examples/*.flow; do npm run -s flow -- render "$file" -o "${file%.flow}.svg"; done
          git diff --exit-code examples/

  e2e:
    name: End to end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The browser binaries are far larger than node_modules.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run end to end tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
