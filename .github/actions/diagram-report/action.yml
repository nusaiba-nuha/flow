name: Flow diagram report
description: >
  Comment on a pull request with what changed in its .flow diagrams: a list,
  and a Mermaid drawing with additions, removals and edits coloured.

inputs:
  base:
    description: The commit to compare against. Defaults to the pull request's base.
    default: ${{ github.event.pull_request.base.sha }}
  token:
    description: A token that may comment on the pull request.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    # The action reads only git and its own source, so there is nothing to install.
    - name: Describe the changed diagrams
      shell: bash
      run: node "${{ github.action_path }}/report.mjs" "${{ inputs.base }}" > "$RUNNER_TEMP/flow-report.md"

    - name: Comment on the pull request
      uses: actions/github-script@v7
      env:
        REPORT: ${{ runner.temp }}/flow-report.md
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs')
          const body = fs.readFileSync(process.env.REPORT, 'utf8')
          const marker = '<!-- flow-diagram-report -->'
          const { owner, repo } = context.repo
          const issue_number = context.issue.number

          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
          const previous = comments.find((comment) => comment.body?.startsWith(marker))

          if (!body.trim()) {
            // Nothing to report now: take down an earlier report rather than leave it stale.
            if (previous) await github.rest.issues.deleteComment({ owner, repo, comment_id: previous.id })
            return
          }

          if (previous) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body })
          else await github.rest.issues.createComment({ owner, repo, issue_number, body })
